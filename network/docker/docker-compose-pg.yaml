version: '3.7'

networks:
  test:
    name: fabric_test

services:
  postgres_audit:
    build:
      context: ./pg
      dockerfile: Dockerfile
    container_name: postgres_audit
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=adminpw
      - POSTGRES_DB=offchaindb
    ports:
      - "5432:5432"
    networks:
      - test
    volumes:
      - pg_data:/var/lib/postgresql/data
      - pg_logs:/var/lib/postgresql/data/pg_log

volumes:
  pg_data:
  pg_logs:
